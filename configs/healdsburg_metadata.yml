description:
  abstract: >-
    This geologic map database provides a framework for understanding the geologic history,
    natural hazards, and resources of the Healdsburg 30-by-60-minute quadrangle in the northern
    California Coast Ranges. The distribution and structural relations of rocks and surficial
    deposits record the assembly and deformation of older crustal units, subsequent sedimentation
    and volcanism, and the development of the modern landscape. Mapped units include the
    Franciscan Complex, Great Valley sedimentary rocks and Coast Range ophiolitic rocks,
    younger sedimentary strata, Sonoma and Clear Lake volcanic rocks, and Quaternary deposits.
    Contacts, faults, fold axes, structural orientation observations, and an interpreted cross
    section connect this stratigraphic framework with the geometry of deformation at and below
    the surface. These relationships provide a geologic basis for investigating earthquake and
    landslide hazards, evaluating mineral and energy resource potential, understanding geologic
    controls on groundwater, and informing land use and infrastructure planning. The map supplies
    foundational geologic information for those applications; quantitative hazard forecasts,
    resource estimates, and site-specific engineering conclusions require additional analyses.
    The database integrates multiple sources of mapping and organizes mapped features,
    map-unit descriptions, terminology, and source citations using the Geologic Map Schema (GeMS).
  purpose: >-
    To provide an integrated geologic framework for reconstructing the stratigraphic and tectonic
    evolution of the Healdsburg quadrangle and for investigating how Earth materials and geologic
    structures influence hazards, groundwater, and mineral and energy resources. The digital
    organization supports comparison of mapping sources, GIS analysis of mapped relations,
    visualization of surface and subsurface interpretations, and preparation of geologic maps.
    Applications must respect the scale and uncertainty of the contributing mapping.
time_period:
  begin_date: '2022'
  end_date: '2026'
  current: Fieldwork and compilation conducted during 2022–2026, as reported by the database compiler; the compilation also incorporates older published mapping.
data_quality:
  lineage:
    process_steps:
      - description: >-
          During 2022–2026, compiled geologic mapping primarily from the previous sources
          listed in the DataSources table and incorporated some new original mapping and
          field observations. Used 1-meter lidar data to assist mapping of landslides and
          young faults. Used aerial photographs to assist geologic mapping and identify
          outcrop locations for field investigation. Organized the compilation and supporting
          descriptions, terminology, and citations in a GeMS-style file geodatabase.
          This description is based on the compiler's account; specific lidar acquisitions,
          aerial photograph dates, and source datasets were not supplied.
        date: '2026'
      - description: >-
          The database compiler reports that topology checks were completed during map
          preparation. The supplied workspace retains topology diagnostic and dirty-area
          tables. Their presence does not establish whether each stored diagnostic is
          current, resolved, or an accepted exception. The independent geometry and boundary
          audit accompanying this metadata records the condition of the supplied snapshot.
        date: '2026'
