constraints:
  access_constraints: Unpublished working database supplied for metadata preparation; public access and release authorization have not been established.
  use_limitations: >-
    Use as an interpretive geologic framework with the accompanying source citations and
    uncertainty attributes. The compilation combines mapping at different scales; the final
    intended publication scale has not been supplied. Enlargement or additional decimal places
    do not increase geologic accuracy. Mapped boundaries and subsurface relations are interpretations
    and may be revised with new observations. This database does not replace site-specific
    geotechnical, groundwater, hazard, or mineral resource investigations. Boundary overruns,
    invalid polygons, missing geometries, and attribute limitations identified in the accompanying
    audit must be considered before analysis or release. Do not interpret diagram coordinates as
    geographic locations or treat negative uncertainty values as measured accuracy.
