[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamapper"
version = "0.1.0"
description = "Command-line tool for generating FGDC/USGS-style geologic metadata XML from YAML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lxml",
  "pyyaml",
  "rich",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest"]
inspect = ["pyogrio", "rasterio"]

[project.scripts]
metamapper = "metamapper.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
